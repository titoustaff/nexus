<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GolfNexus</title>
<meta name="description" content="La suite GolfNexus : planifier, jouer, analyser, s'entraîner.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="saison/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  /* Charte GolfNexus (reprise de saison/style.css) */
  :root {
    --vert: #14532d; --vert-2: #1f7a45; --sauge: #9caf88; --sauge-pale: #eaf0e4;
    --jaune: #f0b400; --fond: #f4f4ee; --carte: #ffffff; --texte: #1c2a20; --doux: #5b6b5f; --bord: #e1e6dc;
    --ombre: 0 1px 2px rgba(20, 40, 25, .06), 0 6px 20px rgba(20, 40, 25, .08);
    --anneau: #c9d4c0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --vert: #86c79a; --vert-2: #5fb27b; --sauge: #6f8562; --sauge-pale: #1f2b22; --jaune: #f2c230;
      --fond: #0f1712; --carte: #17221b; --texte: #e6ede7; --doux: #a3b2a7; --bord: #2a3a2f;
      --ombre: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25); --anneau: #2f4235; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --vert: #86c79a; --vert-2: #5fb27b; --sauge: #6f8562; --sauge-pale: #1f2b22; --jaune: #f2c230;
    --fond: #0f1712; --carte: #17221b; --texte: #e6ede7; --doux: #a3b2a7; --bord: #2a3a2f;
    --ombre: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25); --anneau: #2f4235; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--fond); color: var(--texte);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.45;
    background-image: radial-gradient(circle at 50% 42%, var(--sauge-pale) 0, transparent 60%);
    overflow-x: hidden;
  }
  header { text-align: center; padding: 28px 16px 0; }
  .marque { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; color: var(--vert); }
  .marque span { color: var(--jaune); }
  .marque svg { width: 40px; height: 40px; }
  header p { margin: 6px auto 0; max-width: 560px; color: var(--doux); }

  /* ------------------------------------------------------------ la boucle (grand écran) */
  .scene { position: relative; width: 1200px; height: 1030px; margin: 0 auto; transform-origin: top center; }
  .scene > svg.anneau { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .arc { fill: none; stroke: var(--anneau); stroke-width: 3; stroke-linecap: round; }
  .flux { fill: none; stroke: var(--jaune); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 14; animation: flux 1.6s linear infinite; opacity: .9; }
  @keyframes flux { to { stroke-dashoffset: -32; } }
  .fleche { fill: var(--jaune); }
  .lien-nuage { stroke: var(--anneau); stroke-width: 2; stroke-dasharray: 3 6; fill: none; }

  .coeur {
    position: absolute; left: 600px; top: 470px; transform: translate(-50%, -50%);
    width: 250px; height: 250px; border-radius: 50%; display: grid; place-items: center; text-align: center;
    background: var(--carte); box-shadow: var(--ombre), 0 0 0 10px color-mix(in srgb, var(--sauge) 18%, transparent);
    padding: 26px;
  }
  .coeur svg { width: 64px; height: 64px; }
  .coeur strong { display: block; font-size: 1.35rem; font-weight: 800; color: var(--vert); margin-top: 4px; }
  .coeur strong span { color: var(--jaune); }
  .coeur small { display: block; color: var(--doux); font-size: .8rem; margin-top: 4px; }

  .module {
    --x: calc(600px + cos(var(--a)) * 245px); --y: calc(470px + sin(var(--a)) * 245px);
    position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%);
    width: 128px; text-align: center; text-decoration: none; color: inherit;
  }
  .pastille {
    width: 96px; height: 96px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
    background: var(--c); color: #fff; box-shadow: var(--ombre), 0 0 0 6px var(--fond), 0 0 0 8px color-mix(in srgb, var(--c) 35%, transparent);
    transition: transform .25s ease;
  }
  .pastille svg { width: 46px; height: 46px; }
  a.module:hover .pastille, a.module:focus-visible .pastille { transform: scale(1.08); }
  a.module:focus-visible { outline: none; }
  a.module:focus-visible .pastille { box-shadow: 0 0 0 6px var(--fond), 0 0 0 9px var(--jaune); }
  .module b { display: block; margin-top: 10px; font-weight: 800; font-size: 1.02rem; }
  .module i { display: block; font-style: normal; font-size: .8rem; color: var(--doux); }
  .etat { display: inline-block; margin-top: 5px; font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--bord); color: var(--doux); }
  .etat.ouvert { background: var(--jaune); color: #2e2400; }
  .module.bientot .pastille { filter: saturate(.75); }

  .nuage {
    --x: calc(600px + cos(var(--a)) * 470px); --y: calc(470px + sin(var(--a)) * 420px + max(0, sin(var(--a))) * 85px);   /* en bas, les nuages passent sous les libellés */
    position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%);
    width: 236px; padding: 18px 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    background: color-mix(in srgb, var(--c) 10%, var(--carte));
    border: 1.5px solid color-mix(in srgb, var(--c) 28%, transparent);
    border-radius: 48% 52% 46% 54% / 58% 50% 50% 42%;
    box-shadow: var(--ombre);
    animation: flotte 7s ease-in-out infinite; animation-delay: var(--d, 0s);
  }
  .nuage::before, .nuage::after {
    content: ""; position: absolute; border-radius: 50%; z-index: -1;
    background: inherit; border: inherit;
  }
  .nuage::before { width: 70px; height: 70px; top: -24px; left: 34px; }
  .nuage::after { width: 54px; height: 54px; top: -16px; right: 40px; }
  @keyframes flotte { 50% { translate: 0 -7px; } }
  .nuage span {
    font-size: .76rem; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--carte); color: var(--texte); border: 1px solid color-mix(in srgb, var(--c) 30%, var(--bord));
    white-space: nowrap;
  }

  /* ------------------------------------------------------------ petit écran : la boucle se déroule */
  .liste { display: none; }
  @media (max-width: 760px) {
    .scene { display: none; }
    .liste { display: block; max-width: 560px; margin: 24px auto 0; padding: 0 16px; position: relative; }
    .liste::before { content: ""; position: absolute; left: 47px; top: 40px; bottom: 90px; border-left: 3px dotted var(--jaune); }
    .ligne { display: grid; grid-template-columns: 64px 1fr; gap: 14px; margin-bottom: 18px; position: relative; text-decoration: none; color: inherit; }
    .ligne .pastille { width: 64px; height: 64px; box-shadow: 0 0 0 5px var(--fond); }
    .ligne .pastille svg { width: 32px; height: 32px; }
    .ligne .carte { background: var(--carte); border-radius: 16px; padding: 12px 14px; box-shadow: var(--ombre); border-left: 4px solid var(--c); }
    .ligne b { font-weight: 800; }
    .ligne i { font-style: normal; color: var(--doux); font-size: .85rem; margin-left: 6px; }
    .ligne .etat { float: right; margin-top: 2px; }
    .ligne .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .ligne .tags span { font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 12%, var(--carte)); }
    .retour { text-align: center; color: var(--doux); font-size: .85rem; margin: 4px 0 0 0; }
  }
  @media (prefers-reduced-motion: reduce) { .flux, .nuage { animation: none; } }

  footer { text-align: center; color: var(--doux); font-size: .8rem; padding: 12px 16px 28px; }
  footer a { color: var(--vert-2); }
</style>
</head>
<body>
  <header>
    <div class="marque">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#14532d"/><ellipse cx="30" cy="52" rx="20" ry="5" fill="#2f7d4f"/><path d="M22 10v41" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M24 10l22 8-22 8z" fill="#f0b400"/><circle cx="43" cy="45" r="7" fill="#fff"/></svg>
      Golf<span>Nexus</span>
    </div>
    <p>Une suite d'outils reliés : planifier sa saison, jouer, analyser, s'entraîner… et recommencer, en progressant.</p>
  </header>

  <main>
    <div class="scene" id="scene" aria-label="La boucle GolfNexus">
      <svg class="anneau" id="anneau" viewBox="0 0 1200 1030" aria-hidden="true"></svg>
      <div class="coeur">
        <div>
          <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#14532d"/><ellipse cx="30" cy="52" rx="20" ry="5" fill="#2f7d4f"/><path d="M22 10v41" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><path d="M24 10l22 8-22 8z" fill="#f0b400"/><circle cx="43" cy="45" r="7" fill="#fff"/></svg>
          <strong>Golf<span>Nexus</span></strong>
          <small>En préparation.</small>
        </div>
      </div>
    </div>
    <div class="liste" id="liste"></div>
  </main>

  <footer>Saison et Club sont ouverts, les autres modules arrivent. · <a href="saison/#v=rgpd">Tes données personnelles</a></footer>

<script>
  // Les modules, dans l'ordre de développement (galaxy/MD_DOC/PLAN.md) : Saison → Club → Carte → Stats → Entraînement → Rencontres.
  const ICONES = {
    saison: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M10 13v6" /><path d="M10.5 13l4 1.5-4 1.5z" fill="currentColor"/></svg>',
    rencontres: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4l6 2.5L6 9z" fill="currentColor"/><path d="M18 21V4"/><path d="M18 4l-6 2.5L18 9z" fill="currentColor"/><path d="M3 21h18"/><path d="M10 14h4"/></svg>',
    carte: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M4 8h16M4 13h16M10 3v18M15 3v18"/><path d="M6.5 17.5l1.2 1.2 2-2.4" /></svg>',
    stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><rect x="5.5" y="12" width="3" height="6" rx="1"/><rect x="10.5" y="8" width="3" height="10" rx="1"/><rect x="15.5" y="4" width="3" height="14" rx="1"/></svg>',
    entrainement: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>',
    club: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><circle cx="9.5" cy="11" r="2"/><circle cx="14.5" cy="11" r="2"/><path d="M6.8 17c.6-1.7 1.6-2.5 2.7-2.5s2.1.8 2.5 1.6c.4-.8 1.4-1.6 2.5-1.6s2.1.8 2.7 2.5"/></svg>',
  };
  const MODULES = [
    { id: "saison", nom: "Saison", verbe: "Planifier", c: "#1f7a45", url: "saison/",
      f: ["Tournois ffgolf", "Carte & filtres", "Ma saison", "Place probable", "Mérite", "Calendrier ICS"] },
    { id: "club", nom: "Club", verbe: "Accompagner", c: "#14532d", url: "club/",
      f: ["Équipes", "Coachs", "Invitations", "Rappels", "Suivi des joueurs"] },
    { id: "carte", nom: "Carte", verbe: "Noter ses tours", c: "#0e7490",
      f: ["Score trou par trou", "Putts", "Fairways", "Pénalités", "Sans réseau", "Avec ou sans GPS"] },
    { id: "stats", nom: "Stats", verbe: "Analyser", c: "#6d28d9",
      f: ["Secteurs de jeu", "Strokes gained", "Évolution", "Écart entraînement / jeu", "Simulation Mérite"] },
    { id: "entrainement", nom: "Entraînement", verbe: "Progresser", c: "#b45309",
      f: ["Séances", "Exercices mesurés", "Ateliers putting", "Objectifs par secteur", "Suivi du coach"] },
    { id: "rencontres", nom: "Rencontres", verbe: "Jouer en équipe", c: "#c2410c",
      f: ["Formats de jeu", "Convocations", "Scores en direct", "Résultats", "Calendrier d'équipe"] },
  ];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const etat = (m) => m.url ? '<span class="etat ouvert">Ouvrir</span>' : '<span class="etat">Bientôt</span>';
  const ouvrant = (m, cls, extra) => m.url
    ? `<a class="${cls}" href="${m.url}" ${extra}>` : `<div class="${cls} bientot" ${extra}>`;
  const fermant = (m) => m.url ? "</a>" : "</div>";

  // --- grande boucle
  const scene = document.getElementById("scene"), svg = document.getElementById("anneau");
  const CX = 600, CY = 470, R = 245, N = MODULES.length, ECART = 17, DEPART = -120;   // ECART : degrés laissés libres autour de chaque pastille
  const pt = (deg, rx = R, ry = R) => [CX + Math.cos(deg * Math.PI / 180) * rx, CY + Math.sin(deg * Math.PI / 180) * ry];
  let dessin = "";
  MODULES.forEach((m, i) => {
    const a = DEPART + i * 360 / N, b = a + 360 / N;
    const [x1, y1] = pt(a + ECART), [x2, y2] = pt(b - ECART);
    const arc = `M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    // pointe de flèche, orientée selon la tangente en fin d'arc
    const t = (b - ECART) * Math.PI / 180, tx = -Math.sin(t), ty = Math.cos(t), nx = Math.cos(t), ny = Math.sin(t);
    const p = (k, l) => `${(x2 + tx * k + nx * l).toFixed(1)},${(y2 + ty * k + ny * l).toFixed(1)}`;
    const [nx1, ny1] = pt(a, R + 62, R + 62), [nx2, ny2] = pt(a, 470 - 120, 420 - 85 + Math.max(0, Math.sin(a * Math.PI / 180)) * 85);
    dessin += `<path class="arc" d="${arc}"/><path class="flux" d="${arc}"/><polygon class="fleche" points="${p(6, 0)} ${p(-7, 6)} ${p(-7, -6)}"/>`;
    dessin += `<line class="lien-nuage" x1="${nx1.toFixed(1)}" y1="${ny1.toFixed(1)}" x2="${nx2.toFixed(1)}" y2="${ny2.toFixed(1)}"/>`;
    const style = `style="--a:${a}deg;--c:${m.c};--d:${(-i * 1.1).toFixed(1)}s"`;
    scene.insertAdjacentHTML("beforeend",
      `${ouvrant(m, "module", style)}<div class="pastille">${ICONES[m.id]}</div><b>${esc(m.nom)}</b><i>${esc(m.verbe)}</i>${etat(m)}${fermant(m)}` +
      `<div class="nuage" ${style} aria-label="Fonctionnalités de ${esc(m.nom)}">${m.f.map((x) => `<span>${esc(x)}</span>`).join("")}</div>`);
  });
  svg.innerHTML = dessin;
  // la scène est dessinée pour 1200 px : on la réduit sur les écrans moyens
  const ajuster = () => { scene.style.zoom = Math.min(1, (innerWidth - 16) / 1200); };
  ajuster(); addEventListener("resize", ajuster);

  // --- petit écran : la même boucle, déroulée
  document.getElementById("liste").innerHTML = MODULES.map((m) =>
    `${ouvrant(m, "ligne", `style="--c:${m.c}"`)}<div class="pastille">${ICONES[m.id]}</div>` +
    `<div class="carte">${etat(m)}<b>${esc(m.nom)}</b><i>${esc(m.verbe)}</i>` +
    `<div class="tags">${m.f.map((x) => `<span>${esc(x)}</span>`).join("")}</div></div>${fermant(m)}`).join("") +
    '<p class="retour">↻ … et la boucle recommence avec la saison suivante.</p>';
</script>
</body>
</html>
